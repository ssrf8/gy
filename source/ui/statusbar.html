<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;background:transparent}
#ggbar{--gold:#d9a441;--red-soft:#d9958a;
  --text:#ece5d6;--dim:#a99575;--line:rgba(217,164,65,.24);
  position:relative;overflow:hidden;
  font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;color:var(--text);
  max-width:420px;margin:6px auto;padding:12px 14px 10px;border:1px solid var(--line);border-radius:12px;
  background:
    radial-gradient(130% 70% at 50% -8%,rgba(96,118,205,.16),transparent 55%),
    radial-gradient(80% 55% at 12% 118%,rgba(150,110,220,.08),transparent 60%),
    radial-gradient(90% 60% at 88% 108%,rgba(217,164,65,.10),transparent 62%),
    linear-gradient(180deg,rgba(19,22,46,.95),rgba(9,11,24,.96));
  box-shadow:0 2px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
  line-height:1.5;font-size:12.5px;box-sizing:border-box}
#ggbar .sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
#ggbar .sky b{position:absolute;border-radius:50%;opacity:.6;
  animation:tw var(--d,4s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes tw{from{opacity:.12;transform:scale(.75)}to{opacity:.9;transform:scale(1)}}
#ggbar .meteor{position:absolute;top:16%;right:-12%;width:90px;height:1px;border-radius:1px;opacity:0;
  background:linear-gradient(90deg,rgba(255,250,230,.95),transparent);
  animation:met 11s linear 4s infinite}
@keyframes met{0%{opacity:0;transform:translate(0,0)}2%{opacity:1}10%{opacity:0;transform:translate(-160px,90px)}100%{opacity:0;transform:translate(-160px,90px)}}
#ggbar .env{position:relative;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ggbar .env::before{content:'✦ ';color:rgba(217,164,65,.65);font-size:9px}
#ggbar .tabs{position:relative;display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:thin}
#ggbar .tab{flex:none;padding:2px 9px;font-size:11px;color:var(--dim);cursor:pointer;background:transparent;
  letter-spacing:1px;user-select:none}
#ggbar .tab.off{opacity:.5}
#ggbar .tab.on{color:#171310;background:linear-gradient(180deg,#ecc873,#c9973c);border-radius:999px;padding:2px 11px;
  font-weight:700;box-shadow:0 0 8px rgba(217,164,65,.25)}
#ggbar .stage{position:relative;display:flex;gap:10px;margin-top:9px}
#ggbar .pfig{position:relative;width:118px;height:158px;border:1px solid rgba(217,164,65,.3);border-radius:10px;flex:none;
  overflow:hidden;background:linear-gradient(180deg,rgba(217,164,65,.05),rgba(96,118,205,.05) 62%,rgba(0,0,0,.28))}
#ggbar .pfig img{width:100%;height:100%;object-fit:cover;display:block}
#ggbar .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:rgba(217,164,65,.32);text-shadow:0 0 14px rgba(217,164,65,.18)}
#ggbar .phlab{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;
  color:rgba(217,164,65,.45);letter-spacing:3px}
#ggbar .pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
#ggbar .pname{color:#f4eedd;font-weight:700;font-size:13px;letter-spacing:1px;display:flex;align-items:center;gap:7px}
#ggbar .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 5px rgba(217,164,65,.7)}
#ggbar .offtag{font-size:9.5px;color:var(--dim);border:1px solid rgba(169,149,117,.4);border-radius:3px;padding:0 4px;letter-spacing:1px}
#ggbar .row{display:flex;align-items:baseline;gap:8px;margin-top:6px;font-size:11.5px;line-height:1.45}
#ggbar .tag{flex:none;font-size:10px;letter-spacing:2px}
#ggbar .tag.g{color:var(--gold)}
#ggbar .tag.hv{color:var(--red-soft)}
#ggbar .row .lv{flex:1;min-width:0;overflow-wrap:break-word}
#ggbar .row.g .lv{color:#e6ddca}
#ggbar .row.hv .lv{color:#dca094}
#ggbar .none{color:var(--dim);font-size:11px;margin-top:6px;letter-spacing:1px}
#ggbar .empty{color:var(--dim);text-align:center;padding:10px 0;letter-spacing:2px}
</style>
</head>
<body>
<div id="ggbar" data-gg-statusbar="1"><div class="empty">状态同步中…</div></div>
<script>
(function () {
  var waited = 0, RETRY = 10, STEP = 300;
  // 立绘图源：角色键（记录键或名字）→ 图片地址（data: 或 https:），留空显示占位
  var PORTRAITS = {};
  var skyLayer = null;
  var eventStops = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function stat() {
    try {
      if (window.Mvu && typeof Mvu.getMvuData === 'function') {
        var d = Mvu.getMvuData({ type: 'message', message_id: 'latest' });
        if (d && d.stat_data) return d.stat_data;
      }
    } catch (e) {}
    try {
      if (typeof getVariables === 'function') {
        var v = getVariables({ type: 'message', message_id: 'latest' });
        if (v && v.stat_data) return v.stat_data;
      }
    } catch (e) {}
    return null;
  }

  function remembered() {
    try { return localStorage.getItem('ggbar-sel'); } catch (e) { return null; }
  }
  function remember(k) {
    try { localStorage.setItem('ggbar-sel', k); } catch (e) {}
  }

  // 星空层：只构建一次，逐星随机相位呼吸；低频流星
  function buildSky() {
    var sky = document.createElement('div');
    sky.className = 'sky';
    var colors = ['#ffffff', '#ffffff', '#ffffff', '#f2ca7a', '#9db4ff'];
    for (var i = 0; i < 26; i++) {
      var b = document.createElement('b');
      var s = (Math.random() * 1.6 + 0.8).toFixed(1);
      b.style.left = (Math.random() * 100).toFixed(1) + '%';
      b.style.top = (Math.random() * 100).toFixed(1) + '%';
      b.style.width = s + 'px';
      b.style.height = s + 'px';
      b.style.background = colors[i % colors.length];
      b.style.setProperty('--d', (2.5 + Math.random() * 3.5).toFixed(2) + 's');
      b.style.setProperty('--dl', (-Math.random() * 5).toFixed(2) + 's');
      sky.appendChild(b);
    }
    var m = document.createElement('i');
    m.className = 'meteor';
    sky.appendChild(m);
    return sky;
  }

  function row(cls, label, val) {
    return '<div class="row ' + cls + '"><span class="tag ' + cls + '">' + label + '</span><span class="lv">' + esc(val) + '</span></div>';
  }

  function view(e) {
    var c = e.c, name = c['名字'] || e.k;
    var fig = PORTRAITS[e.k] || PORTRAITS[name] || '';
    var html = '<div class="stage"><div class="pfig">' +
      (fig ? '<img src="' + esc(fig) + '" alt="">' :
        '<span class="ph">' + esc(name.charAt(0)) + '</span><span class="phlab">立绘位</span>') +
      '</div><div class="pinfo"><div class="pname">' + esc(name) +
      (c['在场'] === true ? '<span class="dot"></span>' : '<span class="offtag">场外</span>') + '</div>';
    if (c['状态']) html += row('g', '状态', c['状态']);
    if (c['心声']) html += row('hv', '心声', c['心声']);
    if (!c['状态'] && !c['心声']) html += '<div class="none">（暂无记录）</div>';
    html += '</div></div>';
    return html;
  }

  function render(s) {
    var root = document.getElementById('ggbar');
    var html = '';
    if (!s) {
      html = '<div class="empty">（状态待同步）</div>';
    } else {
      var env = s['环境'] || {}, cast = s['角色'] || {};
      var envLine = [env['日期'], env['时间'], env['地点']].filter(Boolean).join(' · ');
      var on = [], off = [];
      for (var k in cast) {
        var c = cast[k] || {};
        (c['在场'] === true ? on : off).push({ c: c, k: k });
      }
      var all = on.concat(off);
      if (envLine) html += '<div class="env">' + esc(envLine) + '</div>';
      if (!all.length) {
        html += '<div class="empty">（场上无人）</div>';
      } else {
        var sel = null, saved = remembered();
        for (var i = 0; i < all.length; i++) if (all[i].k === saved) { sel = all[i]; break; }
        if (!sel) sel = all[0];

        html += '<div class="tabs">';
        for (var j = 0; j < all.length; j++) {
          var t = all[j];
          html += '<span class="tab' + (t.k === sel.k ? ' on' : '') + (t.c['在场'] === true ? '' : ' off') +
            '" data-k="' + esc(t.k) + '">' + esc(t.c['名字'] || t.k) + '</span>';
        }
        html += '</div>' + view(sel);
      }
    }
    root.innerHTML = html;
    if (!skyLayer) skyLayer = buildSky();
    root.appendChild(skyLayer);
  }

  document.getElementById('ggbar').addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== this && !(t.classList && t.classList.contains('tab'))) t = t.parentNode;
    if (!t || t === this) return;
    remember(t.getAttribute('data-k'));
    var s = stat();
    if (s) render(s);
  });

  function tick() {
    var s = stat();
    if (s) { render(s); return; }
    if (++waited < RETRY) { setTimeout(tick, STEP); return; }
    render(null);
  }

  function renderMvuData(data) {
    if (data && data.stat_data) { render(data.stat_data); return; }
    var s = stat();
    if (s) render(s);
  }

  function bindMvuRefresh() {
    var mvu = window.Mvu;
    if (!mvu || !mvu.events || typeof eventOn !== 'function') return false;
    [mvu.events.VARIABLE_INITIALIZED, mvu.events.VARIABLE_UPDATE_ENDED]
      .filter(Boolean)
      .forEach(function (name) {
        try {
          var disposer = eventOn(name, renderMvuData);
          if (disposer && typeof disposer.stop === 'function') eventStops.push(disposer);
        } catch (e) {}
      });
    return true;
  }

  if (!bindMvuRefresh() && typeof waitGlobalInitialized === 'function') {
    Promise.resolve(waitGlobalInitialized('Mvu')).then(function () {
      bindMvuRefresh();
      renderMvuData();
    }).catch(function () {});
  }
  window.addEventListener('unload', function () {
    while (eventStops.length) {
      try { eventStops.pop().stop(); } catch (e) {}
    }
  });
  tick();
})();
</script>
</body>
</html>
