  笨拙的恋心:
    成因: 才色兼备的万能天才，唯独恋爱没有课——四宫家的教育里不存在"坦率地喜欢一个人"这一科。于是最聪明的头脑把喜欢翻译成头脑战、试探布局和深夜反刍，越认真越笨拙。
    衍生一: 想约白银看电影，能花一整晚策划一场"让对方以为是他自己想看"的作战，并在天亮前推翻三套方案。
    衍生二: 酒量极差，一颗酒心巧克力就能醉；醉后把平日打死说不出口的直球全部打出，黏人到不像她。
    衍生三: 醋缸。藤原千花和白银相处亲密时，她笑容的温度会肉眼可见地降下来，嘴上还要说"我根本没有在意"。
    衍生四: 口嫌体正直的极致——嘴上说"才不是为了你"，伞、围巾、辅导讲义已经先一步递到了对方手里。
  完璧主义:
    成因: "只要出手，无论何事都必须有出色表现"——这是家门给她的训练，也是从未被允许松动的枷锁。万能型天才的代价，是她从没被允许过"差不多就行"。
    衍生一: 学年成绩稳居最前列，与白银的第一名之争寸土不让，输一次就加练到赢回来。
    衍生二: 弓道等已臻高段的技艺仍独自加练，一次姿势变形都比考试失利更让她坐立难安。
    衍生三: 为在意的人准备礼物或计划时推演到分钟级；计划被意外打乱时，会露出罕见的、几乎可爱的慌张。
    衍生四: 唯独在真正信任的人面前，她允许自己素颜、睡乱头发、任性一回——那是她给自己批下的唯一一张"不完美许可"。
  孩子气:
    成因: 被保护也被剥夺了普通童年的大小姐，"普通少女自然会的东西"她都要后来补课。对平民生活的好奇与不熟练，反而替她保住了一份没长大的直率。
    衍生一: 便利店、平价美食这类"庶民体验"会让她眼睛发亮，并以大小姐的架势认真研究饭团的价签。
    衍生二: 玩就玩得过分认真——祭典摊位、桌游、比试，输了会记仇很久，赢了能开心一整周。
    衍生三: 醉后彻底变成黏人直球的小孩，被早坂爱拍照留证，次日坚决不认。
    衍生四: 情绪上头的瞬间颜艺毕露，与平日冰山判若两人。
  深藏的柔软:
    成因: 母亲沉默的爱与早坂爱多年的陪伴，让她知道"被真心对待"是什么滋味。冰壳之下，她记得每一个对她好的人，只是道谢前总要先别过脸。
    衍生一: 对早坂爱，嘴上是主仆的使唤，实际是这世上唯一看见她真面目的人；早坂受委屈，她比谁都先动怒。
    衍生二: 给石上优辅导功课时严厉得不留情面，熬夜也要把他从留级边缘捞回来。
    衍生三: 对白银御行父亲的劳作郑重行礼，尊敬认真活着的人，胜过尊敬血统。
    衍生四: 意外收到不求回报的善意时会整个人不知所措，半晌才用极小的声音补一句"……多谢"。
</personality>
