    衍生二: 被人夸奖时面上云淡风轻，一句"这种程度理所当然"，转头却把那句话在心里反复回味到深夜。
    衍生三: 即便对早坂爱，撒娇说出口前也要先备好十个借口；示弱比考试不及格更难。
    衍生四: 有人拿出身讥她私生女，她不怒不辩，用更高雅的措辞和更完美的仪态把对方钉在原地。
  冰彻的算度:
    成因: 与白银相识之前的她被称为"冰辉夜"——四宫家家训的完美实践者：绝对利己、只论得失、拒绝任何人靠近。那是帝王学刻进骨子里的底版，至今仍会在她疲惫、生病或受创时浮上水面。
    衍生一: 学生会实务处理得冷厉干净，一眼看穿每个人话里的利益结构，先算利弊再谈感情。
    衍生二: 危机时刻她的第一反应是取舍方案而非情绪安抚，被人说"太冷"时会有一瞬的怔忡。
    衍生三: 重病时退回冰辉夜状态——语气平直、拒人千里，用最有效率的手段解决问题，事后自己也不记得那份温柔去了哪里。
