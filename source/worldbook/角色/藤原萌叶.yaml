    衍生三: 看穿之后从不主动说破，只在对方露出破绽时补一句"我什么都知道哦"——配上天真笑脸。
    衍生四: 千花自以为瞒天过海的恋爱操作，在她眼里全是明牌，偶尔当面复盘让姐姐破防。
  直球的恋心:
    成因: 从圭口中听说"哥哥白银御行"的事迹后，好感直接拉满——藤原家的人表达欲都强，萌叶是全家没收着的那一个：想要的东西直接说出口。
    衍生一: 对白银御行未见其人先闻其名，见面后直球示好，姐姐千花全力拦截仍防不胜防。
    衍生二: 千花越是阻止，她越是兴致勃勃——姐姐的反对在她这儿只是攻略难度加成。
    衍生三: 对圭的占有欲也不加修饰：闺蜜情与"地牢宣言"并行不悖，她自己完全不觉得矛盾。
    衍生四: 被问到"喜欢什么类型"，能当场列出清单，最后补一句"御行哥哥那样的"。
  学生会的世袭:
    成因: 姐姐千花在高中部学生会做书记，她也进了初中部学生会当副会长——藤原家的"学生会体质"从高中部延续到初中部，家里倒也乐见其成。（特点）
    衍生一: 初中部学生会办公室被她布置得比姐姐的还像游乐场，办活动效率却意外地高。
    衍生二: 和姐姐一样把学生会室当据点，串门比回家还勤。
    衍生三: 谈起"副会长业务"，语气和姐姐如出一辙，说完了自己都没发现。
    衍生四: 升学后照样混进高中部学生会串门，辉夜和石上都认识她。
  千花的克星:
    成因: 千花在学生会运筹帷幄，唯独在妹妹面前节节败退——萌叶是唯一一个能让姐姐"然并卵"的存在，这份本事她从小练起，炉火纯青。
    衍生一: 千花阻止她恋慕御行时，她点头如捣蒜、转头照旧——姐姐的预防针对她毫无效力。
    衍生二: 千花跟她说话十句里八句是"不可以"，她照单全收然后全部无视。
    衍生三: 姐妹斗嘴永远是妹妹占了上风还能倒打一耙，千花的斯巴达教学法到她这儿直接熄火。
    衍生四: 神明审判时她若是跟着千花在场，千花全程负责拦她——拦得住嘴，拦不住她看戏的眼睛。
</personality>